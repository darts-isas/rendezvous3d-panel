<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .spacecraft { fill: #3865ab; }
      .spacecraft-accent { fill: #84aff1; }
      .asteroid { fill: #8b7355; }
      .asteroid-dark { fill: #5a4a3a; }
      .trajectory { fill: none; stroke: #84aff1; stroke-width: 1.5; stroke-dasharray: 4,3; opacity: 0.7; }
      .trajectory-merged { fill: none; stroke: #f2cc0c; stroke-width: 2; stroke-dasharray: 5,3; }
      .glow { fill: #ff9830; opacity: 0.6; }
    </style>
  </defs>

  <!-- Background stars -->
  <circle cx="10" cy="20" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="85" cy="15" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="92" cy="45" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="15" cy="75" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="88" cy="80" r="1" fill="#fff" opacity="0.5"/>

  <!-- Trajectory from spacecraft (top-left to center-right) -->
  <path class="trajectory" d="M 8 18 Q 35 30, 55 50"/>

  <!-- Trajectory from asteroid (bottom-left to center-right) -->
  <path class="trajectory" d="M 12 82 Q 35 70, 55 50"/>

  <!-- Merged trajectory (center to right) -->
  <path class="trajectory-merged" d="M 55 50 Q 72 50, 95 50"/>

  <!-- Rendezvous point glow -->
  <circle class="glow" cx="55" cy="50" r="6"/>
  <circle cx="55" cy="50" r="3" fill="#ff9830" opacity="0.8"/>

  <!-- Spacecraft (top-left, pointing toward center-right) -->
  <g transform="translate(12, 22) rotate(35)">
    <!-- Main body -->
    <polygon class="spacecraft" points="0,4 18,4 22,8 18,12 0,12"/>
    <!-- Nose cone -->
    <polygon class="spacecraft-accent" points="18,4 26,8 18,12"/>
    <!-- Solar panels -->
    <rect class="spacecraft-accent" x="4" y="0" width="8" height="3" rx="0.5"/>
    <rect class="spacecraft-accent" x="4" y="13" width="8" height="3" rx="0.5"/>
    <!-- Engine glow -->
    <ellipse cx="-2" cy="8" rx="3" ry="2" fill="#84aff1" opacity="0.6"/>
  </g>

  <!-- Asteroid (bottom-left, irregular rock shape) -->
  <g transform="translate(8, 72)">
    <!-- Main asteroid body - irregular polygon for rock appearance -->
    <polygon class="asteroid" points="6,0 14,2 18,8 16,16 10,18 2,14 0,8 3,3"/>
    <!-- Surface details/shadows for rocky texture -->
    <polygon class="asteroid-dark" points="8,4 12,5 14,9 11,12 7,10 6,6"/>
    <polygon class="asteroid-dark" points="3,8 5,12 4,14 2,11"/>
    <polygon class="asteroid-dark" points="13,10 15,13 13,15 11,13"/>
  </g>

  <!-- Small spacecraft silhouette at merge point heading right -->
  <g transform="translate(52, 46)">
    <polygon fill="#3865ab" points="0,2 5,2 7,4 5,6 0,6"/>
    <polygon fill="#84aff1" points="5,2 9,4 5,6"/>
  </g>

  <!-- Small asteroid at merge point -->
  <g transform="translate(56, 51)">
    <polygon fill="#8b7355" points="2,0 5,1 6,3 5,5 3,6 1,5 0,3 1,1"/>
    <polygon fill="#5a4a3a" points="2,1 4,2 4,4 3,4 2,3"/>
  </g>
</svg>
